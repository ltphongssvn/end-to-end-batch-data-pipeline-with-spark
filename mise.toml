# mise.toml
# Declarative runtime toolchain, pinned to the Databricks target envelope.
#
# TARGET: Databricks Free Edition -> serverless compute -> environment version 5
#   Released 2026-02-25, end-of-support 2029-02-25
#   Python 3.12.3 | JDK 17 | Scala 2.13.16 | Databricks Connect 18 | Ubuntu 24.04.3
#   https://docs.databricks.com/aws/en/release-notes/serverless/environment-version/
#
# WHY EXACT PINS: serverless runs Spark Connect. The client and server must share
# the same Python MINOR version or every Python UDF fails with
# "Python versions in the Spark Connect client and server are different."
# Project 2 of this liveProject is entirely UDF work, so drift here is fatal,
# not cosmetic. Local == remote is the root fix; version-chasing is the treadmill.

[tools]
# EXPLICIT PINS, NOT "latest". mise.lock records the resolved version, but with
# a floating spec `mise install` on a new machine is free to resolve something
# newer and then rewrite the lock -- so the lock documents history instead of
# constraining the future. A literal version makes the lock enforce rather than
# merely record. Upgrades become a reviewable diff via `mise upgrade --bump`,
# which matters most for betterleaks: a security tool should change when someone
# decides it changes, not when someone happens to run install.
betterleaks = "1.8.1"
# Vendor prefix is mandatory: mise's default Java vendor is OpenJDK, not Temurin.
# Bare "java@17" silently resolves to a different build than Databricks ships.
java = "temurin-17"
lefthook = "2.1.10"

# uv owns the Python interpreter and dependency graph; mise pins uv itself so the
# resolver version is reproducible too. Python version lives in .python-version.
uv = "0.12.5"

[settings]
# mise.lock: exact versions, download URLs, checksums, and provenance,
# cryptographically verified at lock time. Committed to git.
lockfile = true

# Supply-chain guard: never install a tool release younger than 7 days.
install_before = "7d"

# --- Tasks -------------------------------------------------------------------
# Declarative task runner, committed alongside the toolchain that runs it.
# `mise run <name>` works identically on a laptop and in CI.

[tasks.fmt]
description = "Format sources in place"
run = "uv run ruff format ."

[tasks.lint]
description = "Lint (same invocation CI uses)"
run = "uv run ruff check ."

[tasks.types]
description = "Static type check, for every platform this code runs on"
# BOTH PLATFORMS, DELIBERATELY. mypy defaults to the OS it happens to be running
# on, and it NARROWS sys.platform comparisons -- so a Darwin-only branch is
# invisible to a Linux run and vice versa. Checking one platform leaves the other
# branch unverified everywhere. This fleet is macOS laptops plus a Linux CI
# runner, so either gap is a branch nobody checks.
#
# Not hypothetical: fcntl.F_FULLFSYNC exists only on Darwin. The gate passed on
# every laptop and failed in CI, because a module-level
#   _IS_DARWIN = sys.platform == "darwin"
# defeated the narrowing -- mypy narrows only on inline comparisons inside
# if/elif/else. Inlining fixed the false error; running both platforms is what
# stops the reverse, a Linux-only branch breaking with nobody noticing until a
# laptop runs it.
#
# mypy has no native multi-platform mode (python/mypy#12286); invoking it once
# per target is the documented approach. It is also far cheaper than a CI OS
# matrix, which would only be needed for RUNTIME differences, not type checking.
run = '''
set -euo pipefail
uv run mypy --platform darwin src tests
uv run mypy --platform linux src tests
'''

[tasks.test]
description = "Unit tests, excluding Databricks integration tests"
run = "uv run pytest -m 'not integration'"

[tasks.check]
description = "The quality gate. CI runs exactly this task; nothing is restated in ci.yml"
# SINGLE SOURCE OF TRUTH. Earlier, ci.yml listed lint/format/types/test as
# separate steps -- a second copy of this list that would drift the moment a
# check was added here and forgotten there. ci.yml now runs `mise run check` and
# nothing else, so adding a dependency below extends local runs, the Lefthook
# hooks, and the merge requirement simultaneously.
#
# check:leaks-history rather than check:leaks: the pre-commit hook only ever saw
# the incoming change, so anything committed before hooks existed, or pushed
# with `git commit --no-verify`, has never been scanned. CI is the layer where
# a bypass is caught, which is the whole reason CI must not merely mirror the
# hooks -- it must be strictly broader.
depends = ["lint", "types", "test", "check:config", "check:contracts", "check:leaks-history"]
run = "uv run ruff format --check ."

[tasks.pr]
description = "Open a PR into develop and let GitHub merge it when checks pass"
# ROOT-CAUSE NOTE: this does NOT poll. A laptop-side polling loop (watch the PR,
# sleep, re-check, merge) fails whenever the laptop sleeps, burns local time,
# and re-implements state GitHub already owns. `--auto` hands the decision to
# GitHub: the merge fires server-side the moment the required status check in
# the 'develop-and-main-protection' ruleset reports success.
#
# --merge (not --squash) preserves GitFlow topology; the repo now allows only
# merge commits, so the server enforces it rather than trusting convention.
run = '''
set -euo pipefail
branch="$(git rev-parse --abbrev-ref HEAD)"
if [ "$branch" = "develop" ] || [ "$branch" = "main" ]; then
  echo "refusing: on protected branch '$branch'; work on a feature branch" >&2
  exit 1
fi
git push -u origin "$branch"
gh pr create --base develop --head "$branch" --fill
gh pr merge --auto --merge --delete-branch
gh pr view --json number,autoMergeRequest,mergeStateStatus \
  --jq '{pr:.number, auto:(.autoMergeRequest != null), state:.mergeStateStatus}'
'''

[tasks.pr-status]
description = "Show merge state and checks for the current branch's PR"
run = "gh pr view --json number,title,mergeable,mergeStateStatus,autoMergeRequest,statusCheckRollup --jq '{pr:.number,title,mergeable,state:.mergeStateStatus,auto:(.autoMergeRequest != null),checks:[.statusCheckRollup[]|{name,conclusion}]}'"

[tasks.sync]
description = "Return to develop, pull, and prune branches whose remote is gone"
# Auto-merge deletes the REMOTE branch but cannot touch your local clone, so
# local branches accumulate in a 'gone' state after every merged PR. Encoding
# the cleanup here keeps it a committed step instead of tribal knowledge.
# Uses `git branch -d` (safe delete): refuses to drop anything not fully merged,
# so an unmerged branch that merely lost its remote is never silently lost.
run = '''
set -euo pipefail
git switch develop
git pull --ff-only
git remote prune origin
gone="$(git for-each-ref --format '%(refname:short) %(upstream:track)' refs/heads \
  | awk '$2 == "[gone]" {print $1}')"
if [ -z "$gone" ]; then
  echo "no stale local branches"
else
  echo "$gone" | xargs -n1 git branch -d
fi
git branch -vv
'''

[tasks.pr-wait]
description = "Block until the current branch's PR checks finish, then report merge state"
# ROOT-CAUSE NOTE: never `sleep N && check`. A fixed sleep guesses the duration,
# so it either wastes minutes or reads state before CI reported. A bare retry
# loop is worse: repeated `gh` calls with no backoff can exhaust the 5,000/hour
# REST rate limit and lock the CLI out for the rest of the hour.
#
# `gh pr checks --watch` is event-driven: it blocks, streams state changes, and
# exits on its own when every check reaches a terminal state. --interval caps
# the request rate. Because the PR is already opened with --auto, this task only
# OBSERVES; GitHub performs the merge server-side whether or not this is running.
#
# Checks going green is NOT the same event as the merge landing. GitHub queues
# the auto-merge after the last check reports, so reading state the instant
# --watch returns shows OPEN/CLEAN on a PR that merges a few seconds later.
# After the checks settle, poll the PR state itself with a bounded budget and a
# real interval: 20 polls x 6s caps this at 2 minutes and 20 API calls, so it
# cannot spin against the rate limit and cannot hang a terminal forever.
run = '''
set -euo pipefail
gh pr checks --watch --interval 10 || true

for _ in $(seq 1 20); do
  state="$(gh pr view --json state --jq .state)"
  case "$state" in
    MERGED|CLOSED) break ;;
  esac
  sleep 6
done

gh pr view --json number,state,mergedAt,mergeCommit,mergeStateStatus \
  --jq '{pr:.number, state, mergedAt, commit:.mergeCommit.oid, mergeState:.mergeStateStatus}'
'''

[tasks."check:config"]
description = "Validate pipeline configs against the Pydantic schema"
run = "uv run python -m spark_batch_pipeline.config"

# SCANNER CHOICE: betterleaks, not gitleaks. Same author (Zach Rice), MIT, and a
# drop-in replacement -- identical CLI flags and .gitleaks.toml format. Gitleaks
# now receives security patches only. The substantive difference is the filter:
# betterleaks replaces Shannon entropy with BPE token-efficiency scoring, which
# on the CredData benchmark lifts recall 70.4% -> 98.6% and precision
# 21.1% -> 57.3%. Precision matters as much as recall here: a scanner that cries
# wolf trains people to bypass the hook, which is how the gate really fails.

[tasks."check:leaks"]
description = "Scan the working tree for secrets"
run = "betterleaks dir . --redact --no-banner"

[tasks."check:leaks-staged"]
description = "Scan only staged changes for secrets (pre-commit speed)"
# --staged scans the index, so hook cost is proportional to the change, not the
# repo. --redact keeps findings out of terminal scrollback and CI logs.
run = "betterleaks git --staged --redact --no-banner"

[tasks."check:leaks-history"]
description = "Scan full git history for secrets (pre-push depth)"
run = "betterleaks git --redact --no-banner"

[tasks."check:commit-msg"]
description = "Validate a commit message against Conventional Commits"
# Implemented as a task, not an extra npm dependency: commitlint would pull in
# Node plus a config package to enforce one regex.
#
# ARGUMENTS: declared with a `usage` spec, not "$1" and not the Tera {{arg()}}
# helper. mise does not populate shell positionals in a run script, and the Tera
# helper is deprecated for removal in mise 2026.11.0. usage parses the argument
# and injects it as $usage_msg_file.
usage = '''
arg "<msg_file>" help="Path to the commit message file (passed by lefthook as {1})"
'''
run = '''
set -euo pipefail
msg_file="$usage_msg_file"
subject="$(head -n1 "$msg_file")"

# Merge and revert commits are generated by git; exempt them.
case "$subject" in
  "Merge "*|"Revert "*) exit 0 ;;
esac

pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,}$'
if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
  echo "invalid commit subject:" >&2
  echo "  $subject" >&2
  echo "" >&2
  echo "expected: <type>(<optional scope>): <description>" >&2
  echo "types:    feat fix docs style refactor perf test build ci chore revert" >&2
  echo "example:  feat(ingest): add WDI csv reader" >&2
  exit 1
fi

# NOTE: mise renders task scripts through the Tera template engine BEFORE the
# shell sees them, and "${#" opens a Tera comment -- so ${#subject} fails to
# parse with "Closing comment tag #} not found". Measuring length with awk
# avoids the construct entirely rather than fighting the escaping.
len="$(printf '%s' "$subject" | awk '{print length}')"
if [ "$len" -gt 72 ]; then
  echo "commit subject is $len chars; keep it under 72" >&2
  exit 1
fi
'''

[tasks.setup]
description = "One-command onboarding: install runtimes, dependencies, and git hooks"
# ROOT-CAUSE NOTE: `lefthook install` writes into .git/hooks, which is NOT
# version controlled. A fresh clone has no hooks at all, so the person who most
# needs the guardrails -- someone new to the repo -- is the one running without
# them. Encoding install here makes hooks part of onboarding, not folklore.
# Idempotent: safe to re-run at any time.
#
# The core.hooksPath guard is deliberate. If that setting is present (locally or
# globally), lefthook install renames the existing hook to .old and takes over,
# which can silently disable another tool's global scanner. Failing loudly and
# handing back the exact command is the correct behaviour; silently winning is
# not.
run = '''
set -euo pipefail

hooks_path="$(git config --get core.hooksPath || true)"
if [ -n "$hooks_path" ]; then
  echo "refusing: core.hooksPath is set to '$hooks_path'." >&2
  echo "lefthook would rename the existing hooks to .old and take over," >&2
  echo "which can silently disable another tool's hooks." >&2
  echo "" >&2
  echo "inspect first:" >&2
  echo "  git config --show-origin --get-all core.hooksPath" >&2
  echo "then clear it deliberately:" >&2
  echo "  git config --unset core.hooksPath          # local" >&2
  echo "  git config --global --unset core.hooksPath # global" >&2
  exit 1
fi

mise install
uv sync --locked
lefthook install

echo
echo "setup complete. hooks active:"
ls .git/hooks | grep -vE '\.sample$' | sed 's/^/  /'
'''

[tasks."contracts:update"]
description = "Regenerate committed JSON Schema contracts from the Pydantic models"
# The schema file is a build artifact of the model, never hand-edited. Running
# this is the deliberate act that records a contract change, and the diff it
# produces is what a reviewer reads in the PR.
run = "uv run python -m spark_batch_pipeline.contracts"

[tasks."check:contracts"]
description = "Fail if the committed contracts drift from the models"
# Regenerate into a temp dir and diff. Running the generator in CI and diffing
# is what makes the committed artifact authoritative: a model change that skips
# contracts:update cannot merge.
run = '''
set -euo pipefail
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
uv run python -c "
from pathlib import Path
from spark_batch_pipeline.contracts import write_all
write_all(Path('$tmp'))
" >/dev/null
diff -u contracts "$tmp"

# TRACKED-NESS IS PART OF THE CONTRACT. Regenerating and diffing only proves the
# file on disk matches the model; it says nothing about whether git will ship
# it. A .gitignore rule once hid this exact file and every check still passed.
# ls-files --error-unmatch fails when a path is untracked or ignored, so a
# deliverable can never again be silently excluded.
for schema in contracts/*.schema.json; do
  if ! git ls-files --error-unmatch "$schema" >/dev/null 2>&1; then
    echo "contract not tracked by git: $schema" >&2
    echo "it exists on disk but will not reach the repository or CI." >&2
    echo "check: git check-ignore -v $schema" >&2
    exit 1
  fi
done

echo "contracts up to date and tracked"
'''

# --- Task interpreter ---------------------------------------------------------
# PIN THE SHELL, exactly as we pin the JDK and the Python interpreter.
#
# mise defaults to `sh -c -o errexit -o pipefail`, and `sh` is whatever the OS
# provides. On macOS that is bash in POSIX mode, which accepts `set -o pipefail`.
# On the Ubuntu CI runner it is dash, which does not -- so `mise run check`
# passed locally and died in CI with:
#   sh: 1: set: Illegal option -o pipefail
#
# That is environment drift, the same class as an unpinned runtime: the task
# body was fine, the interpreter differed. Removing pipefail would have treated
# the symptom and left every other task one bashism away from the same failure,
# while also giving up the guarantee that a failing stage of a pipeline fails
# the task.
#
# Pinning bash here makes the interpreter identical on a laptop, in a git hook,
# and on a CI runner. The explicit `set -euo pipefail` at the top of each
# multi-line script is kept deliberately: it stays visible and greppable in the
# script itself rather than being an invisible property of the runner, and under
# bash it is guaranteed legal.
[task_config]
shell = "bash -c"

[tasks.start]
description = "Begin work: claim a terminal and cut a correctly named branch off origin/develop"
# ROOT CAUSE THIS ADDRESSES: `mise run sync` ends on develop, and there was no
# one-step way to begin the next piece of work. So the WRONG thing (edit in
# place) was easier than the right thing (claim, cut, switch). A guard that only
# blocks would leave that asymmetry intact; this removes it.
#
# Terminal numbers come from refs/terminals/ on the remote, never from
# `git worktree list`. The census reads one machine's worktrees, so with six
# laptops each sees a fraction of the sequence, and closing a worktree drops the
# high-water mark and re-issues a burned number. Terminal refs are never
# deleted, so the ceiling only rises.
#
# The claim uses --force-with-lease against the ref, so two laptops racing for
# the same number cannot both win: the loser is rejected with "stale info" and
# the loop retries above the new ceiling. A rejection is the protocol working.
usage = '''
arg "<slug>" help="Short kebab-case description, e.g. wdi-curated-transform"
'''
run = '''
set -euo pipefail
slug="$usage_slug"

case "$slug" in
  *[!a-z0-9-]*|"")
    echo "slug must be lowercase kebab-case: $slug" >&2
    exit 1 ;;
esac

git fetch origin --prune

for attempt in 1 2 3 4 5; do
  ceiling="$(git ls-remote origin 'refs/terminals/*' | grep -oE '[0-9]+$' | sort -n | tail -1 || true)"
  next=$(( ${ceiling:-0} + 1 ))
  ref="refs/terminals/t${next}"

  git update-ref "$ref" HEAD
  if git push origin "$ref" --force-with-lease="$ref": 2>/dev/null; then
    echo "claimed t${next}"
    break
  fi

  # Another machine took this number. Drop the local ref and try the next one.
  git update-ref -d "$ref"
  echo "t${next} already claimed elsewhere, retrying (attempt $attempt)" >&2
  git fetch origin --prune
  if [ "$attempt" = "5" ]; then
    echo "could not claim a terminal after 5 attempts" >&2
    exit 1
  fi
done

branch="t${next}-wt1-${slug}"
git switch -c "$branch" origin/develop
echo
echo "on $branch, cut from origin/develop"
echo "next: work, then 'mise run pr'"
'''

[tasks."check:branch"]
description = "Refuse to commit on a protected branch"
# Fails closed, which is what an unattended agent needs: it will not notice a
# warning, but it will notice a non-zero exit and correct course. The server
# ruleset already rejects the PUSH, but by then the commit exists and has to be
# unwound; catching it here keeps the recovery to a single switch.
run = '''
set -euo pipefail
branch="$(git rev-parse --abbrev-ref HEAD)"

case "$branch" in
  develop|main)
    echo "refusing to commit on '$branch'." >&2
    echo "" >&2
    echo "GitFlow: work happens on a feature branch cut from origin/develop." >&2
    echo "" >&2
    echo "nothing is lost -- carry the work across with:" >&2
    echo "  git switch -c t<N>-wt1-<slug>" >&2
    echo "or start cleanly next time with:" >&2
    echo "  mise run start <slug>" >&2
    exit 1 ;;
esac
'''
