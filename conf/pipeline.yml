# conf/pipeline.yml
# Validated against spark_batch_pipeline.config.PipelineConfig at commit time.
# Credentials never appear here: they come from DATABRICKS_* environment
# variables via DatabricksSettings.
name: wdi-eea-batch

raw_path: /datalake/raw
curated_path: /datalake/curated
serving_path: /datalake/serving

cluster:
  spark_version: "4.0"
  node_type_id: Standard_DS3_v2
  num_workers: 2
  autotermination_minutes: 20
  data_security_mode: SINGLE_USER
  spark_conf:
    spark.sql.session.timeZone: UTC
    spark.databricks.delta.optimizeWrite.enabled: "true"

sources:
  - name: wdi
    format: csv
    # The PDF specifies WDI_csv.zip. That path 301s to a 404: the World Bank
    # renamed the file WDI_CSV.zip (uppercase) and the path is case sensitive.
    # Verified 2026-08-28: 200, 282,845,220 bytes, last-modified 2026-07-15.
    url: https://databank.worldbank.org/data/download/WDI_CSV.zip
    partition_by: [year, month, day]
  - name: eea_co2
    format: json
    url: https://discodata.eea.europa.eu/sql
    partition_by: [year]
