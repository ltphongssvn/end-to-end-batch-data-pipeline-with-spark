# pyproject.toml
# Single source of truth for project metadata, dependencies, and tool config.
# Deps are added via `uv add` (never hand-edited) so uv.lock stays authoritative.

[project]
name = "spark-batch-pipeline"
version = "0.1.0"
description = "End-to-end batch data pipeline: WDI + EEA CO2 -> raw/curated/serving lakehouse on Delta"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Do not resolve dependency releases younger than 1 week: gives bad metadata,
# yanked builds, and compromised packages time to surface before we consume them.
exclude-newer = "1 week"

[tool.uv.build-backend]
module-name = "spark_batch_pipeline"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a live Databricks connection (deselect with -m 'not integration')",
]
