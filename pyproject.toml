# pyproject.toml
# Single source of truth for project metadata, dependencies, and tool config.
#
# LAYER 1 of 2 in the reproducibility model:
#   mise.toml + mise.lock -> system runtimes (JDK 17, uv)
#   pyproject.toml + uv.lock -> Python interpreter, libraries, dev tooling
#
# Dependencies are DECLARED here, not accumulated by a sequence of `uv add`
# calls. uv resolves every group together into one lockfile, so a single
# `uv sync` yields one consistent solution; sequential adds re-resolve the whole
# graph each time and can leave intermediate states in git history.

[project]
name = "spark-batch-pipeline"
version = "0.1.0"
description = "End-to-end batch data pipeline: WDI + EEA CO2 -> raw/curated/serving lakehouse on Delta"
readme = "README.md"
requires-python = "==3.12.*"

# Runtime deps pinned to the Databricks serverless env v5 envelope (Spark 4.0).
# delta-spark moves in lockstep with Spark: 4.0.x <-> 4.0.x.
dependencies = [
  "pyspark[connect]==4.0.*",
  "delta-spark==4.0.*",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260815",
  "httpx>=0.28.1",
  "dagster-pipes>=1.13.19",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# PEP 735 dependency groups: portable across package managers, never shipped in
# a built distribution, and never installed by consumers of this package.
[dependency-groups]
test = [
  "pytest>=8",
  "pytest-cov>=6",
  # Patches httpx at the transport layer, so tests exercise the client the
  # production code actually builds. Injecting a pre-configured client from the
  # test would let a test assert its own settings: a redirect test that sets
  # follow_redirects itself passes even if production forgets it.
  "pytest-httpx>=0.35",
  "chispa>=0.11",          # DataFrame equality assertions; named in Databricks CI guidance
]
lint = [
  "ruff>=0.9",
]
typing = [
  "mypy>=1.14",
]
# `dev` is uv's default-synced group. Composing it from the others means one
# `uv sync` gives a complete local environment with no extra flags.
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typing" },
]

[tool.uv]
# RESOLVER-LEVEL BOUNDARY, not a CI check after the fact.
#
# `uv add dagster` silently downgrades protobuf from 7.36.0 to 6.33.6 -- a
# MAJOR version, underneath a Spark Connect client whose entire premise is
# matching the Databricks serverless runtime. That failure appears as UDFs
# breaking against Databricks, long after the commit that caused it.
#
# A CONSTRAINT, not an override. Constraints narrow the acceptable range and
# only apply to packages already being pulled in, so resolution FAILS loudly
# instead of proceeding with an incompatible version. Overrides do the
# opposite -- they replace declared requirements and install versions a library
# never tested against, which is why they are treated as technical debt.
#
# The Rego policy asserts the same invariant against uv.lock, because uv has a
# known case (astral-sh/uv#18337) where a constraint is skipped for a
# transitive dependency carrying markers. Resolver first, verification second.
constraint-dependencies = ["protobuf>=7,<8"]

# Refuse dependency releases younger than one week: yanked builds, bad metadata,
# and compromised packages surface before we consume them.
exclude-newer = "1 week"

[tool.uv.build-backend]
module-name = "spark_batch_pipeline"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S IS BANDIT: static application security testing as a lint rule, at zero
# additional cost because ruff already runs on every commit. Its absence was
# the largest hole in this project's security posture: the pipeline polices the
# DATA it ingests with a tested policy at 100% coverage, and nothing checked
# the CODE for hardcoded credentials, unsafe subprocess use, weak hashes, or
# unsafe deserialization.
#
# DTZ catches naive datetimes. This project already treats a naive timestamp in
# an attestation as a correctness bug -- AwareDatetime enforces it in the
# models -- so having the linter enforce it everywhere else costs nothing and
# removes a class of bug from review.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct what the security rules flag: assert statements
# are the point, fake digests look like hardcoded secrets, and subprocess calls
# use arguments the test itself controls. Narrow codes rather than a blanket
# ignore, so a genuine finding in a test still surfaces.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
# The Pydantic plugin teaches mypy about model __init__ signatures and
# validators; without it the config models are invisible to our own type gate.
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pydantic-mypy]
# WITHOUT init_typed THE PLUGIN SYNTHESIZES EVERY FIELD AS `Any`.
# That is its default, and deliberately so: Pydantic coerces in lax mode, so a
# typed __init__ can flag calls that succeed at runtime (passing "20" to an int
# field). The cost of that default here is total: ClusterConfig(spark_version=
# "3.5") type-checks clean, so the Literal vocabularies protect nothing at
# author time and Axis 1 collapses to runtime-only.
#
# We turn it on because this project's models are contracts, not lax parsers.
# Coercion tolerance belongs at the trust boundary, where the input is a YAML
# string anyway and goes through model_validate rather than __init__.
init_typed = true

# Mirrors ConfigDict(extra="forbid") into the synthesized __init__, so a typo in
# a keyword argument is a type error rather than a runtime ValidationError.
init_forbid_extra = true

# An alias that only works dynamically cannot be checked statically; warn rather
# than let it look safe.
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a live Databricks connection (deselect with -m 'not integration')",
  "local_spark: depends on Spark Classic internals; no Spark Connect equivalent",
]
